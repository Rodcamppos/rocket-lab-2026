resources:
  jobs:
    CineData_Pipeline:
      name: CineData_Pipeline
      schedule:
        quartz_cron_expression: 55 0 3 * * ?
        timezone_id: America/Recife
        pause_status: UNPAUSED
      tasks:
        - task_key: to_Bronze
          notebook_task:
            notebook_path: /Workspace/Users/rcoc@poli.br/Landing_to_Bronze
            source: WORKSPACE
          environment_key: to_Bronze_environment
        - task_key: to_Silver
          depends_on:
            - task_key: to_Bronze
          notebook_task:
            notebook_path: /Workspace/Users/rcoc@poli.br/Bronze_to_Silver
            source: WORKSPACE
          environment_key: to_Bronze_environment
        - task_key: to_Gold
          depends_on:
            - task_key: to_Silver
          notebook_task:
            notebook_path: /Workspace/Users/rcoc@poli.br/Silver_to_Gold
            source: WORKSPACE
          environment_key: to_Bronze_environment
      queue:
        enabled: true
      environments:
        - environment_key: to_Bronze_environment
          spec:
            environment_version: "5"
      performance_target: PERFORMANCE_OPTIMIZED
